name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, vet and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -s -l .)" || (echo 'Arquivos fora do gofmt:'; gofmt -s -l .; exit 1)
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...

  test:
    name: Test (race + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race
        run: go test -count=1 -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Cobertura por pacote e total
        run: |
          go test -count=1 -cover ./... > /dev/null
          go tool cover -func=coverage.out | tail -1
      - name: Artefato de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
